[tox]
skipsdist = True
envlist = py311, py312, py313

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
deps =
    -rrequirements.txt
    -rrequirements-dev.txt
    -rrequirements-video.txt
    -rrequirements-telemetry.txt
commands =
    flake8 inorbit_edge
    black --check --diff inorbit_edge
    coverage run -m pytest
    coverage html -d {envlogdir}/coverage
